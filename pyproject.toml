[project]
name = "leadforge-monorepo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["leadforge-api", "leadforge-worker"]

[tool.uv]
package = false

[tool.uv.sources]
leadforge-api = { workspace = true }
leadforge-worker = { workspace = true }

[tool.uv.workspace]
members = ["api", "worker"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["leadforge", "leadforge_worker", "conftest"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"conftest.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "worker/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
