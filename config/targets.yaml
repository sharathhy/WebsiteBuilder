# LeadForge discovery targets. Editable here or from the dashboard (Settings > Targets).
# Each enabled city x enabled category becomes one Places Text Search query.
defaults:
  radius_m: 15000
  max_results_per_target: 60   # Places Text Search returns at most 60 per query (3 pages x 20)
  rebuild_threshold: 60        # sites scoring below this go to the rebuild queue
  audit_cache_days: 30
  places_refresh_days: 30

