[project]
name = "leadforge-api"
version = "0.1.0"
description = "LeadForge API: FastAPI app, data model, auth"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "python-multipart>=0.0.17",
  "pyyaml>=6.0",
  "redis>=5.2",
  "arq>=0.26",
  "slowapi>=0.1.9",
  "sentry-sdk[fastapi]>=2.18",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leadforge"]
