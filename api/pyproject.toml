[project]
name = "leadforge-api"
version = "0.1.0"
description = "LeadForge API: FastAPI app, data model, auth"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.1.4",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "python-multipart>=0.0.17",
  "pyyaml>=6.0",
  "redis>=5.2",
  "arq>=0.26",
  "slowapi>=0.1.9",
  "sentry-sdk[fastapi]>=2.18",
  "httpx>=0.28",
  "phonenumbers>=9.0.41",
  "dnspython>=2.9.0",
  "rapidfuzz>=3.14.6",
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.3",
  "openpyxl>=3.1.5",
  "playwright==1.56.0",
  "anthropic>=1.13.0",
  "aiosqlite>=0.20",  # local mode (SQLite)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leadforge"]
