[project]
name = "leadforge-worker"
version = "0.1.0"
description = "LeadForge background workers (ARQ queues)"
requires-python = ">=3.12"
dependencies = ["leadforge-api", "arq>=0.26"]

[tool.uv.sources]
leadforge-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leadforge_worker"]
